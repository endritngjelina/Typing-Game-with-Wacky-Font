<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeChaos Pro - Dynamic Typing Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Creepster&family=Nosifer&family=Butcherman&family=Chiller&family=Eater&family=Fascinate&family=Fredericka+the+Great&family=Griffy&family=Horror&family=Metal+Mania&family=Pirata+One&family=Rye&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .game-area {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .level-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .level-badge {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .difficulty-meter {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .difficulty-bar {
            width: 30px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .difficulty-bar.active {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
        }

        .text-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            min-height: 150px;
            font-size: 1.4rem;
            line-height: 1.8;
            position: relative;
            overflow: hidden;
        }

        .text-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: translateX(-100%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .char {
            position: relative;
            transition: all 0.2s ease;
        }

        .char.correct {
            background: rgba(76, 175, 80, 0.3);
            color: #4CAF50;
        }

        .char.incorrect {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
            animation: shake 0.3s ease-in-out;
        }

        .char.current {
            background: rgba(255, 193, 7, 0.4);
            animation: pulse 1s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .input-area {
            position: relative;
        }

        .typing-input {
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .typing-input:focus {
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .progress-section {
            margin-top: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            width: 0%;
            transition: width 0.3s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            animation: progressShimmer 2s infinite;
        }

        @keyframes progressShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .achievements {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .achievement {
            background: linear-gradient(45deg, #feca57, #ff9ff3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transform: scale(0);
            animation: achievementPop 0.5s ease forwards;
        }

        @keyframes achievementPop {
            0% { opacity: 0; transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        /* Dynamic Font Classes */
        .font-normal { font-family: 'JetBrains Mono', monospace; }
        .font-serif { font-family: 'Times New Roman', serif; }
        .font-script { font-family: 'Fredericka the Great', cursive; }
        .font-horror { font-family: 'Creepster', cursive; }
        .font-metal { font-family: 'Metal Mania', cursive; }
        .font-pirate { font-family: 'Pirata One', cursive; }
        .font-butcher { font-family: 'Butcherman', cursive; }
        .font-eater { font-family: 'Eater', cursive; }

        .effect-blur { filter: blur(1px); }
        .effect-shadow { text-shadow: 3px 3px 6px rgba(0,0,0,0.7); }
        .effect-glow { text-shadow: 0 0 10px currentColor; }
        .effect-distort { transform: skew(-5deg, 2deg); }
        .effect-wave { animation: wave 2s infinite; }

        @keyframes wave {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            .title { font-size: 2rem; }
            .text-display { font-size: 1.1rem; padding: 20px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">TypeChaos Pro</h1>
            <p class="subtitle">Master typing as fonts evolve from simple to chaotic</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">WPM</div>
                <div class="stat-value" id="wpm">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Accuracy</div>
                <div class="stat-value" id="accuracy">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
        </div>

        <div class="game-area">
            <div class="level-indicator">
                <div class="level-badge" id="levelBadge">Level 1: Clean Typography</div>
                <div class="difficulty-meter" id="difficultyMeter">
                    <div class="difficulty-bar active"></div>
                    <div class="difficulty-bar"></div>
                    <div class="difficulty-bar"></div>
                    <div class="difficulty-bar"></div>
                    <div class="difficulty-bar"></div>
                </div>
            </div>

            <div class="text-display" id="textDisplay">
                Click "Start Game" to begin your typing challenge!
            </div>

            <div class="input-area">
                <input type="text" class="typing-input" id="typingInput" placeholder="Start typing here..." disabled>
            </div>

            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="achievements" id="achievements"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startBtn">Start Game</button>
                <button class="btn btn-secondary" id="resetBtn">Reset</button>
                <button class="btn btn-secondary" id="pauseBtn" style="display: none;">Pause</button>
            </div>
        </div>
    </div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Game Complete!</h2>
            <div id="finalStats"></div>
            <button class="btn btn-primary" onclick="closeModal()" style="margin-top: 20px;">Play Again</button>
        </div>
    </div>

    <script>
        class TypingGame {
            constructor() {
                this.texts = [
                    "The quick brown fox jumps over the lazy dog. This pangram contains every letter of the alphabet.",
                    "Programming is the art of telling another human being what one wants the computer to do.",
                    "In the beginning was the Word, and the Word was with God, and the Word was God.",
                    "Artificial intelligence is the simulation of human intelligence in machines that are programmed to think and learn.",
                    "The future belongs to those who believe in the beauty of their dreams and work tirelessly to achieve them.",
                    "Cryptography is the practice and study of techniques for secure communication in the presence of third parties.",
                    "Machine learning algorithms build mathematical models based on training data to make predictions or decisions.",
                    "Quantum computing harnesses quantum mechanical phenomena to process information in fundamentally new ways."
                ];

                this.levels = [
                    { name: "Clean Typography", font: "font-normal", effects: [] },
                    { name: "Serif Classic", font: "font-serif", effects: [] },
                    { name: "Script Challenge", font: "font-script", effects: ["effect-shadow"] },
                    { name: "Horror Show", font: "font-horror", effects: ["effect-glow"] },
                    { name: "Metal Madness", font: "font-metal", effects: ["effect-blur", "effect-shadow"] },
                    { name: "Pirate's Curse", font: "font-pirate", effects: ["effect-distort", "effect-glow"] },
                    { name: "Butcher's Block", font: "font-butcher", effects: ["effect-blur", "effect-distort"] },
                    { name: "Final Chaos", font: "font-eater", effects: ["effect-blur", "effect-distort", "effect-wave", "effect-glow"] }
                ];

                this.currentLevel = 0;
                this.currentText = "";
                this.currentPosition = 0;
                this.startTime = null;
                this.errors = 0;
                this.totalChars = 0;
                this.isGameActive = false;
                this.isPaused = false;
                this.score = 0;
                this.achievements = new Set();

                this.initializeElements();
                this.setupEventListeners();
                this.createParticles();
                this.loadNewText();
            }

            initializeElements() {
                this.textDisplay = document.getElementById('textDisplay');
                this.typingInput = document.getElementById('typingInput');
                this.startBtn = document.getElementById('startBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.wpmDisplay = document.getElementById('wpm');
                this.accuracyDisplay = document.getElementById('accuracy');
                this.levelDisplay = document.getElementById('level');
                this.scoreDisplay = document.getElementById('score');
                this.levelBadge = document.getElementById('levelBadge');
                this.difficultyMeter = document.getElementById('difficultyMeter');
                this.progressFill = document.getElementById('progressFill');
                this.achievementsContainer = document.getElementById('achievements');
                this.gameOverModal = document.getElementById('gameOverModal');
            }

            setupEventListeners() {
                this.startBtn.addEventListener('click', () => this.startGame());
                this.resetBtn.addEventListener('click', () => this.resetGame());
                this.pauseBtn.addEventListener('click', () => this.togglePause());
                this.typingInput.addEventListener('input', (e) => this.handleInput(e));
                this.typingInput.addEventListener('keydown', (e) => this.handleKeyDown(e));
            }

            createParticles() {
                const particlesContainer = document.getElementById('particles');
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 6 + 's';
                    particle.style.animationDuration = (4 + Math.random() * 4) + 's';
                    particlesContainer.appendChild(particle);
                }
            }

            loadNewText() {
                this.currentText = this.texts[this.currentLevel % this.texts.length];
                this.displayText();
                this.updateLevelDisplay();
            }

            displayText() {
                const level = this.levels[Math.min(this.currentLevel, this.levels.length - 1)];
                const chars = this.currentText.split('').map((char, index) => {
                    let className = 'char';
                    if (index < this.currentPosition) {
                        className += this.typingInput.value[index] === char ? ' correct' : ' incorrect';
                    } else if (index === this.currentPosition) {
                        className += ' current';
                    }
                    return `<span class="${className}" data-index="${index}">${char === ' ' ? '&nbsp;' : char}</span>`;
                }).join('');

                this.textDisplay.innerHTML = chars;
                this.textDisplay.className = `text-display ${level.font} ${level.effects.join(' ')}`;
            }

            updateLevelDisplay() {
                const level = this.levels[Math.min(this.currentLevel, this.levels.length - 1)];
                this.levelBadge.textContent = `Level ${this.currentLevel + 1}: ${level.name}`;
                this.levelDisplay.textContent = this.currentLevel + 1;

                // Update difficulty meter
                const bars = this.difficultyMeter.querySelectorAll('.difficulty-bar');
                bars.forEach((bar, index) => {
                    bar.classList.toggle('active', index <= this.currentLevel);
                });
            }

            startGame() {
                this.isGameActive = true;
                this.isPaused = false;
                this.startTime = Date.now();
                this.typingInput.disabled = false;
                this.typingInput.focus();
                this.startBtn.style.display = 'none';
                this.pauseBtn.style.display = 'inline-block';
                this.currentPosition = 0;
                this.typingInput.value = '';
                this.displayText();
            }

            togglePause() {
                this.isPaused = !this.isPaused;
                this.typingInput.disabled = this.isPaused;
                this.pauseBtn.textContent = this.isPaused ? 'Resume' : 'Pause';
                if (!this.isPaused) {
                    this.typingInput.focus();
                }
            }

            resetGame() {
                this.isGameActive = false;
                this.isPaused = false;
                this.currentLevel = 0;
                this.currentPosition = 0;
                this.errors = 0;
                this.totalChars = 0;
                this.score = 0;
                this.achievements.clear();
                this.typingInput.value = '';
                this.typingInput.disabled = true;
                this.startBtn.style.display = 'inline-block';
                this.pauseBtn.style.display = 'none';
                this.pauseBtn.textContent = 'Pause';
                this.achievementsContainer.innerHTML = '';
                this.loadNewText();
                this.updateStats();
                this.updateProgress();
            }

            handleInput(e) {
                if (!this.isGameActive || this.isPaused) return;

                const inputValue = e.target.value;
                const currentChar = this.currentText[this.currentPosition];

                if (inputValue.length > this.currentPosition + 1) {
                    e.target.value = inputValue.slice(0, this.currentPosition + 1);
                    return;
                }

                if (inputValue[this.currentPosition] === currentChar) {
                    this.currentPosition++;
                    this.totalChars++;
                    this.score += Math.max(1, (this.currentLevel + 1) * 2);
                } else if (inputValue[this.currentPosition] !== undefined) {
                    this.errors++;
                    this.totalChars++;
                }

                this.displayText();
                this.updateStats();
                this.updateProgress();
                this.checkAchievements();

                if (this.currentPosition >= this.currentText.length) {
                    this.levelComplete();
                }
            }

            handleKeyDown(e) {
                if (!this.isGameActive || this.isPaused) return;

                if (e.key === 'Backspace' && this.currentPosition > 0) {
                    this.currentPosition--;
                    this.typingInput.value = this.typingInput.value.slice(0, this.currentPosition);
                    this.displayText();
                    this.updateProgress();
                }
            }

            levelComplete() {
                this.currentLevel++;
                this.score += (this.currentLevel * 100);
                
                if (this.currentLevel >= this.levels.length) {
                    this.gameComplete();
                    return;
                }

                // Add level completion achievement
                this.addAchievement(`🎯 Level ${this.currentLevel} Complete!`);
                
                // Brief pause before next level
                setTimeout(() => {
                    this.currentPosition = 0;
                    this.typingInput.value = '';
                    this.loadNewText();
                    this.typingInput.focus();
                }, 1000);
            }

            gameComplete() {
                this.isGameActive = false;
                this.typingInput.disabled = true;
                this.startBtn.style.display = 'inline-block';
                this.pauseBtn.style.display = 'none';
                
                const finalWPM = this.calculateWPM();
                const finalAccuracy = this.calculateAccuracy();
                
                document.getElementById('finalStats').innerHTML = `
                    <div style="font-size: 1.2rem; margin-bottom: 15px;">🎉 Congratulations! 🎉</div>
                    <div style="margin-bottom: 10px;">Final WPM: <strong>${finalWPM}</strong></div>
                    <div style="margin-bottom: 10px;">Final Accuracy: <strong>${finalAccuracy}%</strong></div>
                    <div style="margin-bottom: 10px;">Total Score: <strong>${this.score}</strong></div>
                    <div>Levels Completed: <strong>${this.levels.length}</strong></div>
                `;
                
                this.gameOverModal.classList.add('active');
                this.addAchievement('🏆 Game Master!');
            }

            calculateWPM() {
                if (!this.startTime) return 0;
                const timeElapsed = (Date.now() - this.startTime) / 1000 / 60;
                const wordsTyped = (this.currentPosition / 5);
                return Math.round(wordsTyped / timeElapsed) || 0;
            }

            calculateAccuracy() {
                if (this.totalChars === 0) return 100;
                return Math.round(((this.totalChars - this.errors) / this.totalChars) * 100);
            }

            updateStats() {
                this.wpmDisplay.textContent = this.calculateWPM();
                this.accuracyDisplay.textContent = this.calculateAccuracy() + '%';
                this.scoreDisplay.textContent = this.score;
            }

            updateProgress() {
                const progress = (this.currentPosition / this.currentText.length) * 100;
                this.progressFill.style.width = progress + '%';
            }

            checkAchievements() {
                const wpm = this.calculateWPM();
                const accuracy = this.calculateAccuracy();

                if (wpm >= 60 && !this.achievements.has('speed60')) {
                    this.addAchievement('⚡ Speed Demon (60 WPM)');
                    this.achievements.add('speed60');
                }

                if (wpm >= 100 && !this.achievements.has('speed100')) {
                    this.addAchievement('🚀 Lightning Fast (100 WPM)');
                    this.achievements.add('speed100');
                }

                if (accuracy === 100 && this.currentPosition > 50 && !this.achievements.has('perfect')) {
                    this.addAchievement('🎯 Perfectionist');
                    this.achievements.add('perfect');
                }

                if (this.currentLevel >= 3 && !this.achievements.has('survivor')) {
                    this.addAchievement('💀 Chaos Survivor');
                    this.achievements.add('survivor');
                }
            }

            addAchievement(text) {
                const achievement = document.createElement('div');
                achievement.className = 'achievement';
                achievement.textContent = text;
                this.achievementsContainer.appendChild(achievement);

                setTimeout(() => {
                    achievement.style.animationDelay = '0s';
                }, 100);
            }
        }

        function closeModal() {
            document.getElementById('gameOverModal').classList.remove('active');
        }

        // Initialize the game when the page loads
        window.addEventListener('load', () => {
            new TypingGame();
        });

        // Add some keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
